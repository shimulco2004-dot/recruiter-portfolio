<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800" role="img" aria-labelledby="title desc">
  <title id="title">IRON FITNESS campaign billboard</title>
  <desc id="desc">A dark photographic IRON FITNESS billboard with the official logo and Stronger for Life campaign message.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#080b09" stop-opacity=".96"/><stop offset=".52" stop-color="#080b09" stop-opacity=".63"/><stop offset="1" stop-color="#080b09" stop-opacity=".14"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bad532" stop-opacity=".85"/><stop offset="1" stop-color="#bad532" stop-opacity="0"/></linearGradient>
  </defs>
  <image href="../assets/training-hero-web.jpg" x="0" y="0" width="2400" height="800" preserveAspectRatio="xMidYMid slice"/>
  <rect width="2400" height="800" fill="url(#shade)"/>
  <rect width="18" height="800" fill="url(#edge)"/>
  <rect x="100" y="88" width="190" height="7" fill="#bad532"/>
  <image href="../assets/logo-white.svg" x="100" y="138" width="410" height="180" preserveAspectRatio="xMinYMid meet"/>
  <text x="100" y="455" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="113" font-weight="900" letter-spacing="-4">STRONGER</text>
  <text x="100" y="565" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="113" font-weight="900" letter-spacing="-4">FOR LIFE.</text>
  <text x="105" y="644" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="4">STRENGTH FOR THE LIFE YOU LEAD</text>
  <g transform="translate(1920 116)" fill="#bad532"><path d="M0 0h310l-58 102H0z"/><path d="M0 128h244l-58 102H0z"/><path d="M0 256h178l-58 102H0z"/></g>
  <text x="1922" y="622" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">MOVE WITH PURPOSE</text>
</svg>
