*{box-sizing:border-box}body{margin:0;font-family:Plex,Arial;color:#132B3A}main{width:1080px;height:1080px;padding:65px;background:#F4F2ED;position:relative;overflow:hidden}.logo{width:210px}span{position:absolute;top:75px;right:65px;font-size:16px;letter-spacing:2px}h1{font-size:100px;line-height:1.02;letter-spacing:-4px;max-width:850px;margin:100px 0 30px}p{font-size:28px;max-width:700px;line-height:1.5}.ar{font-family:PlexArabic,Tahoma;font-size:38px;position:absolute;right:65px;bottom:140px;direction:rtl}.foot{position:absolute;left:65px;bottom:65px;font-size:20px;letter-spacing:2px}.corner{position:absolute;right:0;bottom:0;width:180px;height:180px;border-right:25px solid #F26A21;border-bottom:25px solid #F26A21}.graphic{position:absolute;bottom:180px;left:65px;width:250px;height:130px;border:2px solid #132B3A;opacity:.25}.graphic:after{content:'+1h';font-size:100px;font-weight:bold;position:absolute;left:15px;top:-15px}main{background:linear-gradient(0deg,#132B3Af5,#132B3A55),url(craft.webp) 70% center/cover;color:white}main>.logo{filter:brightness(0) invert(1)}h1{position:absolute;bottom:265px;font-size:95px}main>p:not(.ar){position:absolute;bottom:200px}.graphic{display:none}</style></head><body><main><img class="logo" src="logos/logo-navy.svg"><span>TEAM AT WORK / SAMPLE</span><h1>Craft is a team effort.</h1><p>Clear roles. Careful execution.</p><div class="graphic"></div><p class="ar" lang="ar" dir="rtl">فريق واحد، جودة واحدة</p><div class="foot">HANDY WORK / JEDDAH</div><div class="corner"></div></main></body></html>
